services:
  - type: web
    name: expense-splitter-backend
    runtime: python
    buildCommand: |
      pip install -r expense_splitter/Backend/requirements.txt
      cd expense_splitter/Frontend && npm install && npm run build
    startCommand: cd expense_splitter/Backend && gunicorn expense_splitter.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://${RENDER_EXTERNAL_HOSTNAME}"